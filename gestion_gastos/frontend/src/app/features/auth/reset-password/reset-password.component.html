<div class="card">
  <div class="brand">Cash Track</div>
  <p class="tagline">nueva contraseña</p>

  <div class="error-msg" style="margin-bottom: 18px;" *ngIf="!tokenPresente()">
    El enlace no es valido. Solicita uno nuevo desde
    <a routerLink="/olvide-password">olvide mi contraseña</a>.
  </div>

  <div class="success-msg" *ngIf="exito()">
    Tu contraseña se actualizo correctamente. Te llevamos al login...
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
    *ngIf="tokenPresente() && !exito()"
  >
    <div class="field">
      <label for="password">Nueva contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="new-password"
        [class.error]="password.invalid && password.touched"
      />
      <div class="error-msg" *ngIf="password.invalid && password.touched">
        Debe tener al menos 6 caracteres.
      </div>
    </div>

    <div class="field">
      <label for="confirmarPassword">Confirmar contraseña</label>
      <input
        id="confirmarPassword"
        type="password"
        formControlName="confirmarPassword"
        placeholder="••••••••"
        autocomplete="new-password"
        [class.error]="confirmarPassword.touched && form.errors?.['passwordsNoCoinciden']"
      />
      <div
        class="error-msg"
        *ngIf="confirmarPassword.touched && form.errors?.['passwordsNoCoinciden']"
      >
        Las contraseñas no coinciden.
      </div>
    </div>

    <div class="error-msg" style="margin-bottom: 12px;" *ngIf="errorServidor()">
      {{ errorServidor() }}
    </div>

    <button type="submit" [disabled]="cargando()">
      <span class="spinner" [class.show]="cargando()"></span>
      <span>{{ cargando() ? 'Guardando...' : 'Guardar nueva contraseña' }}</span>
    </button>
  </form>

  <div class="footer-link">
    <a routerLink="/login">Volver a iniciar sesion</a>
  </div>
</div>
